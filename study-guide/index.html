<title>FINC 371 Exam 2 Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single study column under a sticky tab bar; the header is a closing statement with a readiness meter. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --ink:#17201D; --muted:#5A6762; --line:#D6DDD9;
  --accent:#2C4A9A; --accent-soft:#E3E9F7; --on-accent:#FFFFFF;
  --ns:#8B9590; --le:#3A73CF; --np:#B7790A; --er:#1F7F55; --bad:#B9382B; --bad-soft:#F8E6E3; --ok-soft:#E1F1E8;
  --keys:#F4F1E6; --keys-line:#DCD4B8;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#172020; --sunk:#1E2928; --ink:#E3EAE7; --muted:#97A49F; --line:#2B3735;
  --accent:#93AAF2; --accent-soft:#222E4D; --on-accent:#0F1513;
  --ns:#7D8884; --le:#78A6F0; --np:#E2A93A; --er:#4CC08A; --bad:#F08A7C; --bad-soft:#3A2220; --ok-soft:#183427;
  --keys:#242318; --keys-line:#4A4630; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#172020; --sunk:#1E2928; --ink:#E3EAE7; --muted:#97A49F; --line:#2B3735;
  --accent:#93AAF2; --accent-soft:#222E4D; --on-accent:#0F1513;
  --ns:#7D8884; --le:#78A6F0; --np:#E2A93A; --er:#4CC08A; --bad:#F08A7C; --bad-soft:#3A2220; --ok-soft:#183427;
  --keys:#242318; --keys-line:#4A4630; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);font-stretch:85%;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--keys-line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+label,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{padding-block:28px 18px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:clamp(30px,6vw,44px);font-weight:800;line-height:1.02;margin-top:8px}
.top-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:8px}
#countdown{font:600 15px var(--mono);color:var(--accent)}
#sync{font-size:13px;color:var(--muted)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:16px;gap:2px}
.seg{display:block;height:100%}.seg-ns{background:var(--ns)}.seg-le{background:var(--le)}.seg-np{background:var(--np)}.seg-er{background:var(--er)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot-ns{background:var(--ns)}.dot-le{background:var(--le)}.dot-np{background:var(--np)}.dot-er{background:var(--er)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 12px;font:600 15px var(--body);color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 64px}
.panel{display:flex;flex-direction:column;gap:16px}.panel[hidden]{display:none}
.intro{color:var(--muted);margin:0}.intro p{margin:0 0 10px}
.h-sub{font-size:20px;margin-top:8px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-ns{color:var(--ns)}.chip-le{color:var(--le)}.chip-np{color:var(--np)}.chip-er{color:var(--er);background:var(--ok-soft)}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}

/* plan */
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.day header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.day h3{font-size:22px}
.day-count{margin-left:auto;font:600 13px var(--mono);color:var(--muted)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.checks input{width:18px;height:18px;accent-color:var(--er);flex:none}
.checks label{flex:1 1 220px;min-width:0}
.checks input:checked+label{color:var(--muted);text-decoration:line-through}
.notes{border-left:3px solid var(--np);padding:4px 0 4px 16px}
.notes h3{font-size:18px}.notes ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:15px}

/* topics */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:64px}
.topic-row{width:100%;display:grid;grid-template-columns:62px 1fr auto auto;gap:10px;align-items:center;padding:14px 16px;background:none;border:0;text-align:left}
.topic-unit{font:600 12px var(--mono);color:var(--muted)}
.topic-name{font-weight:700;min-width:0}
.pips{display:flex;gap:3px}.pip{width:8px;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}.pip.ok{background:var(--er);border-color:var(--er)}.pip.no{background:var(--bad);border-color:var(--bad)}
@media (max-width:560px){.topic-row{grid-template-columns:1fr auto}.topic-unit{grid-column:1/-1}.pips{grid-column:1/-1}}
.lesson{padding:4px 18px 20px;border-top:1px solid var(--line);max-width:100%}
.lesson p,.lesson li{max-width:70ch}
.lesson h4{font-size:18px;margin:18px 0 6px}
.lesson ul,.lesson ol{padding-left:20px}
.hint{font:600 13px var(--mono);color:var(--muted)}
.rule{font-family:var(--display);font-size:20px;font-weight:700;border-left:4px solid var(--accent);padding-left:12px}
.lesson-actions{margin-top:16px}
.fcard{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
.fcard-h{font:700 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);padding:8px 12px}
.eq{font-family:var(--mono);font-size:15px;overflow-x:auto}
.eq.big{font-size:17px;padding:12px;background:var(--accent-soft)}
.fcard dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0;padding:12px;font-size:15px}
.fcard dt{font-weight:700;color:var(--muted)}.fcard dd{margin:0;min-width:0}
@media (max-width:560px){.fcard dl{grid-template-columns:1fr}.fcard dd{margin-bottom:6px}}
.example{background:var(--sunk);border-radius:10px;padding:12px 14px;margin:14px 0}
.example-h{font:700 13px var(--mono);color:var(--accent);margin-bottom:4px}
.example p{margin:4px 0}
.flag{border-left:3px solid var(--np);background:var(--surface);padding:8px 12px;margin:12px 0;font-size:15px}
.flag::before{content:"Check this · ";font-weight:700;color:var(--np)}
.keys{background:var(--keys);border:1px solid var(--keys-line);border-radius:8px;padding:10px 12px;margin:10px 0;font:14px/1.6 var(--mono);overflow-x:auto}
.keys-h{display:inline-block;font-weight:700;margin-right:8px;color:var(--np)}
.tbl{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;display:block;overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
.tbl th{font:700 12px var(--mono);text-transform:uppercase;color:var(--muted)}

/* practice */
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.start{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.start b{font-family:var(--display);font-size:20px}.start span{color:var(--muted);font-size:15px}

.q-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.q-prompt{font-size:18px;margin:10px 0 14px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);background:var(--sunk)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}.opt.sel .opt-l{background:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--er);background:var(--ok-soft)}.opt.right .opt-l{background:var(--er);color:var(--on-accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .opt-l{background:var(--bad);color:var(--on-accent)}
.sol{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:16px}
.sol p{margin:6px 0}.sol .eq{line-height:1.8}
.sol-h{font:700 16px var(--display);font-stretch:85%}
.sol-ok .sol-h{color:var(--er)}.sol-no .sol-h{color:var(--bad)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.result h3{font-size:26px}

/* mistakes */
.mistake{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:12px;padding:16px 18px}
.mis-ans{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600}.bad{color:var(--bad)}.good{color:var(--er)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:6px}
.empty{text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px}

/* flashcards */
.seg-ctl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.seg-ctl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.seg-ctl button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card-term .card-eq{font-family:var(--body);font-size:15px}
.gloss{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 16px;margin:12px 0}
.gloss dt{font-weight:700}.gloss dd{margin:0;min-width:0;color:var(--ink)}
@media (max-width:560px){.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:8px}}
.def{display:block;margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.card-name{font:700 18px var(--display);font-stretch:85%}
.card-when{font-size:14px;color:var(--muted)}
.card-eq{margin-top:auto;font:14px/1.5 var(--mono);color:var(--muted)}
.card.flip{border-color:var(--accent)}.card.flip .card-eq{color:var(--ink);background:var(--accent-soft);padding:8px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.opt,.card,.start,.tpick{transition:border-color .15s,background-color .15s}}

<script>
/* ===== Pure logic: math, topics, question generators (no DOM) ===== */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const rs=(a,b,s)=>{const k=Math.round((b-a)/s);return +(a+ri(0,k)*s).toFixed(6);};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const com=(x,d=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const $m=x=>(x<0?'−$':'$')+com(Math.abs(x),2);
const $0=x=>(x<0?'−$':'$')+com(Math.abs(x),0);
const pc=x=>(+(+x).toFixed(4)).toString()+'%';
const dec=x=>(+(x/100).toFixed(6)).toString();
const f6=x=>x.toFixed(6);

const PMT=(P,r,n)=>r===0?P/n:P*r/(1-Math.pow(1+r,-n));
const PVA=(A,r,n)=>r===0?A*n:A*(1-Math.pow(1+r,-n))/r;
const FVA=(A,r,n)=>A*(Math.pow(1+r,n)-1)/r;
const BAL=(P,r,n,k)=>PVA(PMT(P,r,n),r,n-k);
const NPER=(B,r,A)=>-Math.log(1-B*r/A)/Math.log(1+r);
function solveRate(f,lo=1e-7,hi=1){for(let i=0;i<200;i++){const m=(lo+hi)/2;if(f(m)>0)lo=m;else hi=m;}return (lo+hi)/2;}
const npvAt=(r,c0,cfs)=>c0+cfs.reduce((s,c,t)=>s+c/Math.pow(1+r,t+1),0);

/* TI-84 keystroke helpers */
function tvm(o){
  const v=x=>x===null?'<b>0 (solve)</b>':(typeof x==='number'?(+x.toFixed(4)).toLocaleString('en-US',{maximumFractionDigits:4}):x);
  const order=['N','I%','PV','PMT','FV'];
  const cells=order.map(k=>`${k}=${o.solve===k?'<b>?</b>':v(o[k])}`).join(' · ');
  return `<div class="keys"><span class="keys-h">TI-84</span>APPS → 1:Finance → 1:TVM Solver<br>${cells} · P/Y=${o.PY} · C/Y=${o.PY} · PMT:END<br>Move the cursor to <b>${o.solve}</b>, press <kbd>ALPHA</kbd> <kbd>ENTER</kbd> (SOLVE).${o.after?'<br>'+o.after:''}</div>`;
}
const tiLine=(s)=>`<div class="keys"><span class="keys-h">TI-84</span>${s}</div>`;

const TOPICS=[
 {id:'k',unit:'Ch 6',name:'Contracts & closings',quant:false},
 {id:'kt6',unit:'Ch 6',name:'Key terms: contracts & closings',quant:false,kt:6},
 {id:'brk',unit:'Ch 8',name:'Brokerage & agency',quant:false},
 {id:'kt8',unit:'Ch 8',name:'Key terms: brokerage',quant:false,kt:8},
 {id:'apc',unit:'Ch 9',name:'Appraisal concepts',quant:false},
 {id:'apm',unit:'Ch 9',name:'Appraisal math',quant:true},
 {id:'kt9',unit:'Ch 9',name:'Key terms: appraisal',quant:false,kt:9},
 {id:'fin',unit:'Ch 16',name:'Mortgage law, markets & regulation',quant:false},
 {id:'uw',unit:'Ch 16',name:'Underwriting ratios: MDR, TDR, LTV, DCR',quant:true},
 {id:'kt16',unit:'Ch 16',name:'Key terms: financing',quant:false,kt:16},
 {id:'lump',unit:'Ch 17',name:'Lump sums & compounding',quant:true},
 {id:'annuity',unit:'Ch 17',name:'Annuities & sinking funds',quant:true},
 {id:'npv',unit:'Ch 17',name:'NPV, IRR & risk',quant:true},
 {id:'kt17',unit:'Ch 17',name:'Key terms: risk, return & TVM',quant:false,kt:17},
 {id:'pay',unit:'Ch 18',name:'Mortgage payments & amortization',quant:true},
 {id:'bal',unit:'Ch 18',name:'Loan balances, interest & principal',quant:true},
 {id:'refi',unit:'Ch 18',name:'Refinancing',quant:true},
 {id:'points',unit:'Ch 18',name:'Points & effective interest rate',quant:true},
 {id:'arm',unit:'Ch 18',name:'Two-step mortgages & ARMs',quant:true},
 {id:'kt18',unit:'Ch 18',name:'Key terms: mortgage mechanics',quant:false,kt:18},
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));

/* Build a multiple-choice question from a numeric answer plus mistake-based distractors */
function fmtU(v,u){if(u==='$')return $m(v);if(u==='%')return v.toFixed(2)+'%';if(u==='mo')return v.toFixed(1)+' months';if(u==='x')return v.toFixed(2)+'×';return String(v);}
function numQ(topic,prompt,ans,unit,sol,wrong=[],allowNeg=false){
  const gap=unit==='%'?0.15:unit==='mo'?3:unit==='x'?0.04:Math.max(Math.abs(ans)*0.02,2);
  const out=[ans];
  const ok=v=>isFinite(v)&&(allowNeg||v>0)&&out.every(o=>Math.abs(o-v)>gap)&&fmtU(v,unit)!==fmtU(ans,unit);
  for(const w of wrong){if(out.length<4&&ok(w))out.push(w);}
  let g=0;
  while(out.length<4&&g++<200){
    let v;
    if(unit==='%')v=ans+pick([-1,1])*rs(0.25,Math.max(1.75,Math.abs(ans)*0.08),0.125);
    else if(unit==='x')v=ans+pick([-1,1])*rs(0.05,0.3,0.01);
    else if(allowNeg&&Math.abs(ans)<5000)v=ans+pick([-1,1])*rs(500,6000,250);
    else v=ans*(1+pick([-1,1])*rs(0.04,0.2,0.01));
    if(ok(v))out.push(v);
  }
  const opts=shuffle(out.map((v,i)=>({t:fmtU(v,unit),c:i===0})));
  return {topic,prompt,choices:opts.map(o=>o.t),answer:opts.findIndex(o=>o.c),sol};
}
function mcQ(topic,item){
  const [q,choices,why]=item;
  const opts=shuffle(choices.map((t,i)=>({t,c:i===0})));
  return {topic,prompt:q,choices:opts.map(o=>o.t),answer:opts.findIndex(o=>o.c),sol:why};
}

/* ===== Numeric generators ===== */

function makeQ(topic,mode){
  const g=GEN[topic]||[],b=BANK[topic]||[],T=TOPIC[topic];
  let useNum;
  if(T.kt)useNum=true;
  else if(mode==='theory')useNum=!b.length;
  else if(mode==='math')useNum=g.length>0;
  else useNum=g.length&&(b.length===0||Math.random()<(T.quant?0.5:0.15));
  return useNum?pick(g)():mcQ(topic,pick(b));
}

/* Key-term questions, both directions, distractors from the same chapter minus synonyms */
function ktQ(ch){
  const pool=TERMS.filter(x=>x.c===ch),t=pick(pool);
  const others=shuffle(pool.filter(x=>x!==t&&(t.g<0||x.g!==t.g)));
  const ds=[];for(const o of others){if(ds.length===3)break;if(o.g<0||!ds.some(d=>d.g===o.g))ds.push(o);}
  const topic='kt'+ch;
    const q=Math.random()<0.55?mcQ(topic,[`Which term from Chapter ${ch} matches this definition?<br><span class="def">“${esc(t.s)}”</span>`,[t.t].concat(ds.map(d=>d.t)),`<b>${esc(t.t)}</b>: ${esc(t.d)}`]):null;
  if(q){q.key=t.t;return q;}
  const short=x=>{const s=x.d.split(/(?<=[a-z0-9%)]\.)\s+(?=[A-Z])/)[0];return s.length>180?s.slice(0,177)+'…':s;};
  const r=mcQ(topic,[`Which best describes <b>${esc(t.t)}</b>?`,[short(t)].concat(ds.map(short)).map(esc),`<b>${esc(t.t)}</b>: ${esc(t.d)}`]);
  r.key=t.t;return r;
}
[6,8,9,16,17,18].forEach(ch=>{GEN['kt'+ch]=[()=>ktQ(ch)];});

lump:`
<p>Money has a time value: a dollar today can be invested, so it is worth more than a dollar next year. <b>Compounding</b> moves money forward in time. <b>Discounting</b> moves it back. Every TVM problem starts with one question: <i>am I moving one amount, or a series of equal payments?</i> This topic is the one-amount case.</p>
${fc('Future value of a lump sum','FV = PV(1 + i)<sup>n</sup>','PV = amount today · i = rate per period · n = number of periods','One amount today grows to a future date (land appreciating, a deposit growing).','Constant rate; interest is reinvested every period.','Using a percent instead of a decimal (10 not 0.10); multiplying i × n (that is simple interest, not compound).')}
${fc('Present value of a lump sum','PV = FV / (1 + i)<sup>n</sup>','FV = future amount · i = discount (required) rate · n = periods','You know a future amount and want what it is worth today ("how much should I pay now?").','Same rate every period.','Multiplying instead of dividing; using the wrong n.')}
${fc('Monthly (or other) compounding','FV = PV(1 + i/m)<sup>n·m</sup>','m = compounding periods per year (12 for monthly) · n = years','Whenever the problem says "compounded monthly" or payments are monthly.','The stated rate is an annual nominal rate.','Dividing the rate by 12 but forgetting to multiply years by 12, or the reverse.')}
${ex('land appreciation (from your notes)',`<p>$70,000 of land growing 10% a year: year 1 = $77,000, year 2 = $84,700, year 3 = <b>$93,170</b>. Reverse it: PV of $93,170 in 3 years at 10% = $70,000.</p>`)}
<p><b>Uneven cash flows</b> ($500, $1,000, $1,500) are not an annuity. Discount each one separately and add them. On the TI-84: <code>npv(rate, 0, {500,1000,1500})</code>.</p>
<p><b>Solving for the rate:</b> i = (FV/PV)<sup>1/n</sup> − 1. On the TI-84, fill N, PV (negative), FV and solve I%.</p>
<div class="keys"><span class="keys-h">TI-84 setup</span>APPS → 1:Finance → 1:TVM Solver. Money you pay out is <b>negative</b>, money you receive is <b>positive</b>. Set P/Y and C/Y to the same number (1 for annual, 12 for monthly). Cursor on the unknown, then <kbd>ALPHA</kbd> <kbd>ENTER</kbd>.</div>`,

annuity:`
<p>An <b>annuity</b> is a series of <i>equal</i> payments at <i>regular</i> intervals: rent checks, loan payments, savings deposits. An <b>ordinary annuity</b> pays at the end of each period (the default). An <b>annuity due</b> pays at the beginning (rent on the 1st). On the TI-84, switch PMT:END to PMT:BEGIN, then switch back afterward.</p>
${fc('Present value of an annuity','PVA = A × [1 − 1/(1 + i)<sup>n</sup>] / i','A = payment per period · i = rate per period · n = number of payments','Value today of a stream of equal payments (a lease, an income stream, the amount you can borrow).','Equal payments, end of period, constant rate.','Using it for unequal payments; forgetting to convert to monthly i and n.')}
${fc('Future value of an annuity','FVA = A × [(1 + i)<sup>n</sup> − 1] / i','Same variables','How much a series of equal deposits grows to.','Deposits at the end of each period.','Confusing it with PVA. Ask: is the answer "today" or "at the end"?')}
${fc('Sinking fund payment','A = FVA × i / [(1 + i)<sup>n</sup> − 1]','FVA = target amount','How much to deposit each period to reach a future goal (roof replacement fund).','Deposits earn the stated rate.','Using the mortgage payment formula (that one starts from a present value).')}
${ex('Ng\'s income stream (study exercise 7)',`<p>$5,000 a year for 10 years at 10%: PVA = 5,000 × [1 − 1/1.1<sup>10</sup>]/0.10 = 5,000 × 6.144567 = <b>$30,722.84</b>.</p><div class="keys"><span class="keys-h">TI-84</span>N=10 · I%=10 · PV=? · PMT=5000 · FV=0 · P/Y=1 → solve PV = −30,722.84</div>`)}`,

npv:`
<p>Every investment decision compares what you give up with what you expect to get. <b>NPV</b> puts everything in today's dollars and subtracts the cost. <b>IRR</b> is the return the deal actually earns.</p>
${fc('Net present value','NPV = −CF<sub>0</sub> + Σ CF<sub>t</sub> / (1 + r)<sup>t</sup>','CF<sub>0</sub> = initial cost · CF<sub>t</sub> = cash flow in year t (the last year includes the sale price) · r = required return','Deciding whether to buy: accept if NPV &gt; 0, reject if NPV &lt; 0.','Cash flows arrive at year-end and r reflects the deal\'s risk.','Forgetting to subtract the price; leaving the sale proceeds out of the final year; discounting year 1 by 0 periods.')}
${fc('Internal rate of return','Find r so that NPV = 0','Same cash flows','Finding the actual return. Accept if IRR ≥ required return.','Cash flows are reinvested at the IRR.','Comparing IRR with the wrong benchmark. With uneven cash flows IRR can have more than one answer, which is why NPV is preferred when comparing deals.')}
${ex('your notes\' $10,000 deal',`<p>Cash flows $100, $1,600, $1,800, $450, $12,500 at a 12% required return. NPV ≈ <b>+$24.82</b>, so accept (barely). IRR = <b>12.0646%</b>, just above 12%. Both rules agree.</p><div class="keys"><span class="keys-h">TI-84</span>APPS → Finance → 7:npv( → <code>npv(12, −10000, {100,1600,1800,450,12500})</code><br>APPS → Finance → 8:irr( → <code>irr(−10000, {100,1600,1800,450,12500})</code></div>`)}
<h4>Risk and return</h4>
<p>Required return = <b>risk-free rate</b> (Treasuries) + <b>risk premium</b>. Investors are risk-averse, so more risk demands more return.</p>
<ul><li><b>Business risk</b>: the economy or market hurts the property's income.</li><li><b>Financial risk</b>: using debt raises the chance of default.</li><li><b>Purchasing power (inflation) risk</b>: inflation erodes real cash flows.</li><li><b>Liquidity risk</b>: you can't sell quickly at market value.</li></ul>
<p><i>Ex ante</i> = forward-looking expected return. <i>Ex post</i> = what actually happened.</p>`,

pay:`
<p>A mortgage payment is just an annuity solved for the payment: the loan amount is the present value of all the payments.</p>
${fc('Mortgage payment','A = PV × i / [1 − 1/(1 + i)<sup>n</sup>]<br><span class="muted">monthly: use i/12 and n×12</span>','PV = loan amount · i = rate per period · n = number of payments','Any fully amortizing fixed-rate loan.','Fixed rate, equal payments, paid off to zero.','Using the annual rate with monthly payments; computing the annual payment and dividing by 12 (that gives the wrong answer).')}
<h4>Three loan structures</h4>
<ul><li><b>Interest-only</b>: payment = loan × rate. The full principal is due as a balloon at maturity. Lowest payment, most total interest.</li><li><b>Fully amortizing</b>: each payment covers interest plus some principal; the balance reaches 0. Interest falls and principal rises with every payment.</li><li><b>Partially amortizing (balloon)</b>: amortized over a long schedule but due sooner, so a balloon pays off the rest.</li></ul>
<h4>Building an amortization schedule</h4>
<ol><li>Interest = beginning balance × rate per period</li><li>Principal = payment − interest</li><li>Ending balance = beginning balance − principal</li></ol>
${ex('$100,000, 10%, 10 years (from your notes)',`<p>Annual payments: <b>$16,274.54</b>. Year 1 interest = $10,000, principal = $6,274.54. Total interest over the loan = $62,745.40.<br>Monthly payments: <b>$1,321.51</b>; month 1 interest = $100,000 × 0.10/12 = $833.33.</p><p>Why isn't 12 × $1,321.51 = $16,274.54? Monthly payments retire principal sooner, so less interest builds up: 12 × 1,321.51 = $15,858.12.</p>`)}
<p><b>Maximum loan</b> from an affordable payment = PVA of that payment (solve PV on the TI-84).</p>`,

<p class="rule">The balance on a loan at any time = the present value of the payments still left, discounted at the contract rate.</p>
${fc('Outstanding balance after k payments','Bal<sub>k</sub> = A × [1 − 1/(1 + i/m)<sup>nm − k</sup>] / (i/m)','A = monthly payment · i/m = monthly rate · nm − k = payments remaining','Prepayment, refinancing, or finding principal and interest in a given month or year.','No missed or extra payments.','Using payments made instead of payments remaining; using the original loan amount.')}
${flag('Your notes label this formula "Future value of an annuity," but the method they describe (and the answer $125,841.83) is the <b>present value of the remaining payments</b>. Use the PV version.')}
<ul><li><b>Interest in payment k+1</b> = Bal<sub>k</sub> × i/12. Principal = payment − interest.</li><li><b>Principal repaid in year y</b> = balance at start of the year − balance at end.</li><li><b>Interest paid in year y</b> = 12 × payment − principal repaid that year.</li></ul>
${ex('$133,000, 30 years, 7.5% (from your notes)',`<p>Payment = $929.96. Balance after 60 payments = PV of 300 remaining = <b>$125,841.83</b>. After 72 = $124,060.02.<br>Principal in year 6 = $1,781.81. Interest in year 6 = $11,159.52 − $1,781.81 = <b>$9,377.71</b>.<br>Interest in payment 61 = $125,841.83 × 0.075/12 = $786.51; principal = $143.45.</p><div class="keys"><span class="keys-h">TI-84</span>TVM Solver: N=360, I%=7.5, PV=133000, FV=0, P/Y=12 → solve PMT.<br>Then <code>bal(60)</code> → balance. <code>ΣPrn(61,72)</code> → principal in year 6. <code>ΣInt(61,72)</code> → interest in year 6. (All in APPS → Finance; results show as negative.)</div>`)}`,

refi:`
<p>Refinancing replaces the old loan's <b>current balance</b> with a new loan at a new rate. You can take the benefit two ways.</p>
<ol><li><b>Lower payment</b>: new PMT on the balance at the new rate over the remaining term.</li><li><b>Shorter term</b>: keep the old payment, solve for N at the new rate.</li></ol>
${ex('from your notes',`<p>Balance at month 60 = $125,841.83; new rate 6%; 300 months left.<br>Option 1: new payment = <b>$810.80</b>, saving $119.16 a month ($35,748 over 300 months).<br>Option 2: keep paying $929.96 → N = 226.34, so 227 payments, <b>73 months</b> sooner.</p><div class="keys"><span class="keys-h">TI-84</span>Option 1: N=300, I%=6, PV=125841.83, FV=0, P/Y=12 → solve PMT<br>Option 2: I%=6, PV=125841.83, PMT=−929.96, FV=0 → solve N</div>`)}
<p><b>Common mistakes:</b> refinancing the original loan amount instead of the current balance; using 360 months instead of the remaining term; forgetting that real decisions also count refinancing costs (the textbook examples leave them out).</p>`,

points:`
<p>Lenders charge <b>discount points</b> (to buy a lower rate) and <b>origination fees</b> (to cover costs). Each point = 1% of the loan, paid up front. Either way the borrower receives less cash but pays as if they borrowed the full amount, so the true cost is higher than the contract rate.</p>
${fc('Effective interest rate (IRR of the loan)','Net proceeds = PV of payments (+ PV of balance if prepaid)','Net proceeds = loan × (1 − points) · payment is on the <i>full</i> loan at the contract rate','Comparing loans with different rate/point combinations.','Rate is annualized as monthly IRR × 12.','Computing the payment on the net proceeds; forgetting the payoff balance when the loan is prepaid.')}
<ul><li>No points or fees → effective rate = contract rate.</li><li>The <b>sooner</b> you prepay, the <b>higher</b> the effective rate, because the up-front cost is spread over fewer months.</li><li>Points make sense for borrowers who keep the loan a long time.</li></ul>
${ex('Spider Savings (from your notes)',`<p>7.25% with 3 points. Held to maturity the effective rate is only a little above 7.25%. Prepaid early, it rises to about <b>8.125%</b>, worse than First Bank's 7.5% with no points.</p><div class="keys"><span class="keys-h">TI-84</span>Held to maturity: N=360, PV=net proceeds, PMT=−payment, FV=0, P/Y=12 → solve I%<br>Prepaid at month k: N=k, PV=net proceeds, PMT=−payment, FV=−balance at k → solve I%</div>`)}`,

arm:`
<p>Alternatives to the fixed-rate mortgage shift some interest rate risk to the borrower in exchange for a lower starting rate.</p>
<h4>Two-step mortgage</h4>
<p>A fixed rate for an initial period (often 5–7 years), then <b>one</b> reset to index (e.g., 10-year Treasury) + margin, sometimes capped. Good for borrowers who expect to move or refinance before the reset.</p>
<h4>Adjustable-rate mortgage (ARM)</h4>
<ul><li>Contract rate = <b>index + margin</b> (often the 1-year T-bill), adjusted periodically (usually yearly).</li><li><b>Teaser</b>: a discount off the first-year rate.</li><li><b>Annual cap</b>: limits how much the rate changes at each adjustment (often both up and down).</li><li><b>Lifetime cap</b>: limits the total change from the initial rate.</li></ul>
<h4>Method at every adjustment</h4>
<ol><li>Find the balance at the old rate (PV of remaining payments, or <code>bal(</code>).</li><li>Find the new rate: index + margin, then apply caps.</li><li>New payment = PMT on that balance at the new rate over the <b>remaining</b> months.</li></ol>
${ex('study exercise 6',`<p>$335,000, 30-year two-step at 5.5%, resets after year 5 to T-bond + 2%, capped at 5 points above the initial rate. T-bond = 7.5%.<br>Initial payment = $1,902.09. Balance after 60 payments = $309,743.02.<br>New rate = 7.5 + 2 = 9.5% (below the 10.5% cap). New payment for 300 months = <b>$2,706.21</b>.</p>`)}
${flag('Your notes don\'t show the ARM table from study exercise 7, so whether the lifetime cap is measured from the teaser rate or the fully indexed rate is unconfirmed. This guide measures it from the initial (year-1) contract rate, the usual textbook approach. Check your slides.')}`,

uw:`
<p>Underwriting asks two things: can the <b>borrower</b> repay, and is the <b>property</b> good collateral? Lenders follow Fannie Mae and Freddie Mac guidelines in three areas: LTV, down payment source and income ratios.</p>
${fc('Mortgage debt ratio (front-end)','MDR = (P&I + taxes + insurance) / gross monthly income','All monthly. Taxes and insurance are usually given per year, so divide by 12.','Residential qualifying. Conventional limit ≈ <b>28%</b>.','Uses gross (pre-tax) income.','Leaving out taxes and insurance; mixing annual and monthly numbers.')}
${fc('Total debt ratio (back-end)','TDR = (housing payment + other monthly debts) / gross monthly income','Other debts: car, cards, student loans','Conventional limit ≈ <b>36%</b>. FHA and VA allow higher ratios.','','Putting the car loan in the MDR (it only goes in the TDR).')}
${fc('Loan-to-value','LTV = loan / property value','Value = lesser of price or appraisal','Above 80% → PMI or FHA/VA. Conventional max ≈ 95–96.5%. VA up to 100%. Commercial ≈ 70%.','','Using the down payment instead of the loan.')}
${fc('Debt coverage ratio (commercial)','DCR = NOI / annual debt service','NOI = income after operating expenses (before debt) · DS = 12 × monthly payment','Commercial loans. Lenders typically require <b>≥ 1.20</b>.','','Comparing annual NOI with a monthly payment.')}
${ex('study exercise 18',`<p>Income $48,000 → $4,000/month. Housing = $1,040 + $1,200/12 = $1,140 → MDR = <b>28.5%</b> (over 28%). TDR = ($1,140 + $260)/$4,000 = <b>35%</b> (under 36%). She fails the conventional front-end ratio but would likely qualify FHA, which allows higher ratios.</p>`)}
${flag('Your notes say FHA/VA allow "higher" ratios but give no exact numbers. If the exam asks for specific FHA limits, check your slides.')}
<p><b>Down payment rules:</b> conventional loans over 80% LTV need at least 5% from the borrower's own funds. Gifts need a gift letter. FHA seller contributions over 6% count as an inducement and reduce the loan. Under ECOA, lenders decide within <b>30 days</b>.</p>`,

fin:`
<h4>How a mortgage works</h4>
<ul><li><b>Promissory note</b> = the promise to pay; makes the borrower personally liable. <b>Mortgage / deed of trust</b> = the security instrument pledging the property.</li><li><b>Title theory</b>: the lender holds title until payoff. <b>Lien theory</b>: the borrower holds title; the lender has a lien and must foreclose.</li><li>Note clauses: <b>prepayment</b> (pay early without penalty), <b>acceleration</b> (whole balance due on default), <b>due-on-sale</b> (whole balance due if sold).</li></ul>
<h4>Foreclosure</h4>
<ul><li><b>Judicial</b>: through the courts (lien-theory states). <b>Nonjudicial</b>: uses a power-of-sale clause and is faster. <b>Strict</b>: the lender simply takes title.</li><li><b>Deficiency judgment</b>: the borrower owes the shortfall if the sale doesn't cover the debt (not allowed in every state).</li><li><b>Deed of trust</b>: three parties (borrower, lender, trustee); the trustee can sell on default. <b>Deed in lieu</b>: the borrower hands the property back voluntarily.</li></ul>
<h4>Housing finance system</h4>
<table class="tbl"><tr><th>Entity</th><th>Role</th></tr>
<tr><td>FHA</td><td><b>Insures</b> loans; low down payments; up-front + annual premiums</td></tr>
<tr><td>VA</td><td><b>Guarantees</b> loans for veterans; up to 100% LTV</td></tr>
<tr><td>PMI</td><td>Private insurance on conventional loans over 80% LTV</td></tr>
<tr><td>Fannie Mae</td><td>Created to buy FHA loans; private GSE since 1968; buys loans and issues MBS; conservatorship in 2008</td></tr>
<tr><td>Ginnie Mae</td><td>1968, part of HUD; <b>guarantees</b> MBS backed by FHA/VA loans with full federal backing</td></tr>
<tr><td>Freddie Mac</td><td>1970; secondary market for <b>conventional</b> loans</td></tr></table>
<p><b>Originators:</b> mortgage bankers (borrow from banks, originate about half of loans, sell them and keep servicing), mortgage brokers (match borrowers and lenders, no own funds), commercial banks, savings institutions (thrifts), credit unions.</p>
<h4>Federal laws</h4>
<table class="tbl"><tr><th>Law</th><th>Remember</th></tr>
<tr><td>ECOA</td><td>No discrimination by race, color, religion, national origin, sex, marital status, age, public assistance; decision within 30 days</td></tr>
<tr><td>Truth-in-Lending</td><td>Disclose the APR and finance charges within 3 business days</td></tr>
<tr><td>RESPA</td><td>Settlement cost estimate within 3 business days; no kickbacks; right to see the closing statement; escrow limits</td></tr>
<tr><td>Flood Disaster Protection Act</td><td>Flood insurance required in flood hazard zones (NFIP)</td></tr>
<tr><td>FCRA</td><td>Accurate credit data; permission to pull credit; tell the applicant if the report caused a denial</td></tr>
<tr><td>Dodd-Frank</td><td>Post-2008; created the CFPB</td></tr></table>
<h4>Commercial capital</h4>
<p>Individual investors, life insurance companies and pension funds (long horizons), REITs (equity REITs most common; mortgage REITs about 20%), commercial banks (community under $500M, regional, money center; prefer short-term loans), CMBS, and TIF (future tax increases repay redevelopment).</p>
${flag('Your notes say REITs must distribute 95% of taxable income. Current U.S. law requires 90%. Go with whatever your textbook or professor says.')}`,

apm:`
<p>Appraisers estimate value three ways, then reconcile them.</p>
${fc('Cost approach','Value = site value + (replacement cost − accrued depreciation)','Site value from comparable land sales · depreciation = physical + functional + economic','New or special-purpose buildings (a church) where sales data is thin.','A buyer could build a substitute.','Depreciating the land (land doesn\'t depreciate); forgetting to add the site.')}
${flag('Your notes\' cost approach example says $150,000 + $567,500 = $718,000. The arithmetic gives <b>$717,500</b>. The $718,000 is probably rounded. Check the textbook.')}
${fc('Age-life depreciation','Depreciation % = effective age / total economic life','e.g., 15 / 60 = 25%','Estimating physical deterioration.','','Using remaining life instead of age.')}
${fc('Gross income multiplier','GIM = sale price / gross income &nbsp;→&nbsp; Value = GIM × gross income','From comparable sales','Quick income valuation when expenses are similar across properties.','Similar expense ratios.','Mixing monthly and annual income.')}
${fc('Direct capitalization','Value = NOI / R &nbsp;&nbsp; (R = NOI / price from comps)','NOI = gross income − vacancy & collection loss − operating expenses','Income-producing property.','Stable income.','Subtracting mortgage payments to get NOI; using 9 instead of 0.09.')}
${ex('your notes',`<p>GIM: $1,000,000 / $100,000 = 10 → a property with $9,000 gross income ≈ $90,000.<br>Cap rate: $100,000 / $1,000,000 = 10% → $105,000 NOI / 0.10 = <b>$1,050,000</b>.<br>Sales comparison lot: 9,600 sq ft × adjusted $2.95/sq ft = <b>$28,320</b>.</p>`)}
<p><b>Sales comparison adjustments:</b> always adjust the <i>comparable</i> toward the subject. Comp better than the subject → subtract. Comp worse → add. Work in price per sq ft for lots.</p>`,

apc:`
<h4>Regulation</h4>
<p><b>FIRREA (1989)</b>, after the S&amp;L crisis: federally related transactions need state-licensed or certified appraisers. The <b>Appraisal Foundation</b> (1987) runs the <b>AQB</b> (qualifications) and the <b>ASB</b> (writes <b>USPAP</b>: 15-hour course, 7-hour update every 2 years).</p>
<table class="tbl"><tr><th>Level</th><th>May appraise</th><th>Experience</th></tr>
<tr><td>Trainee</td><td>Under supervision</td><td>None (75 hrs education)</td></tr>
<tr><td>Licensed residential</td><td>1–4 units: non-complex under $1M, complex under $250K</td><td>2,000 hrs</td></tr>
<tr><td>Certified residential</td><td>1–4 units, any value</td><td>2,500 hrs</td></tr>
<tr><td>Certified general</td><td>Any property</td><td>3,000 hrs (1,500 non-residential)</td></tr></table>
<h4>Kinds of value</h4>
<ul><li><b>Market value</b>: most probable price in an open, competitive market (typical motivation, informed parties, reasonable exposure, cash-equivalent terms, no special concessions).</li><li><b>Investment value</b>: worth to one specific investor. <b>Price</b>: what was actually paid. <b>Assessed value</b>: for taxes. <b>Insurable value</b>: the destructible part only, so no land.</li></ul>
<h4>Four principles</h4>
<ul><li><b>Anticipation</b>: value = expected future benefits.</li><li><b>Change</b>: markets move, so values are date-specific.</li><li><b>Substitution</b>: no one pays more than an equal substitute costs (basis of all three approaches).</li><li><b>Contribution</b>: a feature is worth what it adds, not what it cost.</li></ul>
<h4>The appraisal process (in order)</h4>
<ol><li>Define the problem (type of value, property, rights, purpose, effective date)</li><li>Select and collect data</li><li>Highest and best use: legally permissible, physically possible, financially feasible, maximally productive</li><li>Apply the three approaches</li><li>Reconcile (a weighted judgment, not a simple average)</li><li>Report (URAR form for homes, narrative for complex properties)</li></ol>
<h4>Sales comparison</h4>
<p>3–6 recent arm's-length comps. Six elements of comparison: <b>property rights, conditions of sale, financing terms, market conditions, location, physical characteristics</b>.</p>
<h4>Cost approach details</h4>
<p><b>Reproduction</b> = exact replica; <b>replacement</b> = equal utility with modern materials (usually used). Cost methods: comparative-unit ($/sq ft), segregated-cost (by component), quantity-survey (every material, most accurate). Depreciation: <b>physical deterioration</b> (curable or incurable), <b>functional obsolescence</b> (bad design; curable or incurable), <b>economic obsolescence</b> (external; usually incurable).</p>`,

k:`
<h4>Valid contract checklist</h4>
<ol><li>Offer</li><li>Acceptance (must <b>mirror</b> the offer; any change makes it a <b>counteroffer</b> and the roles switch)</li><li>Consideration (each side gives up something; can be "love and affection")</li><li>Parties with capacity (minors and the mentally incompetent can void it)</li><li>Lawful purpose</li><li><b>Real estate only:</b> in writing (Statute of Frauds), with an adequate property description</li></ol>
<p>Exception to the writing rule: <b>partial performance</b> that shows the parties' intent.</p>
<h4>Breach and remedies</h4>
<p>A buyer can sue for <b>specific performance</b> (every property is unique), damages, or the return of earnest money. A seller rarely gets specific performance (buyers aren't unique) but usually keeps the earnest money and may seek damages.</p>
<h4>Contingencies</h4>
<p><b>Financing</b> (cancel if no loan in time; the buyer must try in good faith), <b>title</b> (cancel if title defects can't be cured), <b>inspection and repair</b> (the seller repairs up to a limit, or the buyer can cancel). Unconscionable conditions are unenforceable.</p>
<h4>Other contracts</h4>
<ul><li><b>Option to buy</b>: the optionee may buy but doesn't have to; the optionor must sell if exercised; the fee is nonrefundable.</li><li><b>Contract for deed</b> (land contract): the seller keeps legal title; the buyer is the equitable owner and pays taxes and maintenance; title passes after the final payment.</li></ul>
<h4>Before closing</h4>
<table class="tbl"><tr><th>Buyer</th><th>Seller</th></tr><tr><td>Get financing, examine title, survey, insurance binder, inspect, check zoning and leases</td><td>Prepare the deed, remove encumbrances (tax liens), pay off or arrange assumption of the loan (certificate of satisfaction), cooperate with inspectors, turn over leases</td></tr></table>
<h4>Closing costs</h4>
<table class="tbl"><tr><th>Buyer (paid in cash, ~2–6% of loan)</th><th>Seller (deducted from proceeds)</th></tr><tr><td>Origination fee (1–3%), discount points, appraisal, credit report, lender inspection, mortgage insurance, attorney, hazard insurance, recording the mortgage</td><td>Brokerage commission, attorney (deed), documentary stamp tax, recording the satisfaction of the old mortgage</td></tr></table>
<p><b>Prorations:</b> taxes, insurance, assumed-loan payments, service contracts, rents and heating oil are split by days of ownership. <b>Escrow closing:</b> a neutral agent holds the deed and the money; the parties needn't be present. <b>Sales contract essentials:</b> property description, price and payment terms, escrow arrangement, what happens if improvements are destroyed, closing date. "Time is of the essence" means deadlines are strict.</p>
<h4>Negotiation</h4><p>Not zero-sum: enlarge the pie with terms ("you name the price, I'll name the terms"), find common ground early, understand what the other side needs.</p>`,

brk:`
<h4>Sales process (5 steps)</h4><p>Listing → marketing and qualifying buyers → presentation and negotiation → contract → closing.</p>
<h4>Listing agreements (seller ↔ broker)</h4>
<table class="tbl"><tr><th>Type</th><th>Who gets paid</th></tr>
<tr><td>Open</td><td>Only the broker who brings the buyer; owner can sell commission-free; many brokers allowed</td></tr>
<tr><td>Exclusive-agency (exclusive-brokerage)</td><td>One broker; paid unless the <b>owner</b> sells it</td></tr>
<tr><td>Exclusive-right-to-sell</td><td>The broker is paid <b>no matter who</b> sells it (brokers' favorite)</td></tr>
<tr><td>Net</td><td>The broker keeps everything above the seller's amount. Illegal in many states (fraud incentive)</td></tr>
<tr><td>Limited-service</td><td>MLS entry and minimal service, lower fee</td></tr></table>
<p><b>Buyer representation:</b> exclusive-right-to-represent (paid whenever the buyer buys) vs. open (paid only for properties the broker found).</p>
<h4>Agency</h4>
<ul><li>Principal = client; agent = broker; the sales associate is the broker's agent and the client's <b>subagent</b>.</li><li>Fiduciary duties: <b>good faith, diligence, confidentiality</b> (continues after the agency ends), <b>loyalty</b>. The principal owes compensation.</li><li>Even a seller's agent must be honest with buyers and disclose material defects (e.g., flooding).</li><li><b>Fraud</b> = intentional falsehood. <b>Misrepresentation</b> = false statement even without intent.</li><li><b>Dual agent</b>: represents both sides (illegal in some states). <b>Transaction broker</b>: limited help to both, advocate for neither.</li><li>Disclose the agency relationship at first substantive contact.</li></ul>
<h4>Fair housing</h4><p>Protected: <b>sex, race, color, religion, national origin, disability, familial status</b>. Illegal: <b>steering</b> (guiding buyers by protected class) and <b>blockbusting</b> (scare tactics). Laws: Civil Rights Act of 1866; Fair Housing Act (enforced by HUD). Penalties up to $52,596 (first) / $105,194 (repeat within 7 years).</p>
<h4>Seven ways an agency ends</h4><ol><li>Transaction occurs</li><li>Term expires (no date given: "reasonable time," about 3 months residential, 6 commercial)</li><li>Mutual agreement</li><li>Breach by either party</li><li>Incapacity (death, insanity)</li><li>Destruction of the property</li><li>Eminent domain (no commission)</li></ol>
<h4>Compensation</h4><p>Commission is a % of price, paid at closing, negotiated individually (brokers agreeing on rates = antitrust violation). MLS splits, e.g., 6% split 50-50 = 3% each. Associates get a share of their broker's portion, rising with production. Desk-fee offices: keep about 100% for a monthly fee. Recovery funds and bonds cover uncollectible judgments. License required to collect any commission.</p>`,
};

let dbRef=null,saveT=null;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbRef){clearTimeout(saveT);saveT=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(S))).then(()=>sync('Progress saved to your account')).catch(()=>sync('Saved on this device only'));},700);}
}
function sync(t){const el=document.getElementById('sync');if(el)el.textContent=t;}
(async()=>{
  try{
    const db=(window.claude&&window.claude.use)?await window.claude.use('db'):null;
    if(!db){sync('Progress saved on this device');return;}
    dbRef=db.doc('progress/main');
    const snap=await dbRef.get();
    if(snap.exists){const d=snap.data()||{};if((d.updated||0)>(S.updated||0)){S=Object.assign(def(),d);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}renderAll();}}
    else if(S.updated)save();
    sync('Progress saved to your account');
  }catch(e){dbRef=null;sync('Progress saved on this device');}
})();

/* status: exam-ready requires at least 4 of your last 5 answers correct */
function stats(id){const a=S.att[id]||[];const last=a.slice(-5);const c=last.reduce((x,y)=>x+y,0);return {n:a.length,last,c};}
function status(id){const s=stats(id);
  if(s.n===0)return S.read[id]?'le':'ns';
  if(s.last.length>=5&&s.c>=4)return 'er';
  if(s.c/s.last.length>=0.5)return 'np';
  return 'le';}
function statusHint(id){const s=stats(id),st=status(id);
  if(st==='er')return `${s.c} of your last 5 correct`;
  if(s.n===0)return S.read[id]?'Lesson opened. Answer questions to move up.':'Open the lesson, then practice';
  const need=Math.max(0,5-s.last.length);
  return `${s.c} of last ${s.last.length} correct · need 4 of your last 5${need?` (${need} more to answer)`:''}`;}
function record(q,given){
  const ok=given===q.answer;
  (S.att[q.topic]=S.att[q.topic]||[]).push(ok?1:0);
  if(S.att[q.topic].length>20)S.att[q.topic]=S.att[q.topic].slice(-20);
  if(!ok){S.mistakes.unshift({topic:q.topic,prompt:q.prompt,given:given==null?'(no answer)':q.choices[given],right:q.choices[q.answer],sol:q.sol,t:Date.now()});S.mistakes=S.mistakes.slice(0,80);}
  return ok;}

const chip=st=>`<span class="chip chip-${st}">${STATUS.find(x=>x.k===st).label}</span>`;

/* ---------- header ---------- */
function renderHeader(){
  const now=new Date(),ms=EXAM_AT-now;
  let cd;
  if(ms<=0)cd='Exam time. Good luck.';
  else{const h=Math.floor(ms/3.6e6),d=Math.floor(h/24);cd=d>0?`${d} day${d>1?'s':''}, ${h%24} hr until the exam`:`${h} hr ${Math.floor(ms%3.6e6/6e4)} min until the exam`;}
  document.getElementById('countdown').textContent=cd;
  const counts={ns:0,le:0,np:0,er:0};TOPICS.forEach(t=>counts[status(t.id)]++);
  document.getElementById('meter').innerHTML=STATUS.slice().reverse().map(s=>counts[s.k]?`<span class="seg seg-${s.k}" style="flex:${counts[s.k]}" title="${s.label}: ${counts[s.k]}"></span>`:'').join('');
  document.getElementById('meter-legend').innerHTML=STATUS.map(s=>`<span><i class="dot dot-${s.k}"></i>${s.label} <b>${counts[s.k]}</b></span>`).join('');
}
setInterval(renderHeader,30000);

/* key-term lessons are built from the notes' own glossary */
[6,8,9,16,17,18].forEach(ch=>{LESSONS['kt'+ch]=`<p>Every key term from the Chapter ${ch} list in your notes, word for word. Read each one, cover the definition and say it back, then practice. Questions go both ways: definition → term, and term → definition.</p><dl class="gloss">${TERMS.filter(t=>t.c===ch).map(t=>`<dt>${esc(t.t)}</dt><dd>${esc(t.d)}</dd>`).join('')}</dl>`;});

/* ---------- tabs ---------- */
let tab='plan';
try{const h=location.hash.replace('#','');if(h)tab=h;}catch(e){}
function go(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+t);renderPanel(t);window.scrollTo(0,0);}
function renderPanel(t){({plan:renderPlan,topics:renderTopics,practice:renderPractice,exam:renderExam,mistakes:renderMistakes,formulas:renderFormulas}[t]||renderPlan)();}
function renderAll(){renderHeader();renderPanel(tab);}

/* ---------- plan ---------- */
function renderPlan(){
  const el=document.getElementById('p-plan');
  el.innerHTML=`<div class="intro"><p>Plan built on a default of about 2.5 / 4 / 4.5 hours. Tell Claude your real hours and it will reshape this. The exam is <b>all multiple choice</b>, <b>no formula sheet</b>, <b>TI-84 allowed</b>, so every practice question here is multiple choice with TI-84 steps, and the formulas tab drills recall.</p></div>`+
  PLAN.map(d=>{const done=d.items.filter(i=>S.plan[i[0]]).length;return `<section class="day"><header><h3>${d.day}</h3><span class="muted">${d.sub}</span><span class="day-count">${done}/${d.items.length}</span></header><ul class="checks">${d.items.map(([id,txt,link])=>{
    const t=link&&TOPIC[link];
    return `<li><input type="checkbox" id="pl-${id}" data-plan="${id}" ${S.plan[id]?'checked':''}><label for="pl-${id}">${esc(txt)}</label>${t?chip(status(link)):''}${link?`<button class="link" data-go="${link}">${t?'Open':'Start'}</button>`:''}</li>`;}).join('')}</ul></section>`;}).join('')+
  `<section class="notes"><h3>About your materials</h3><ul>
  <li>Source: “FINC 371 - Exam 2” in your Google Drive (a classmate's notes covering Units 6, 8, 9 and Chapters 16–18). Every page was read.</li>
  <li><b>Formulas and figures were images and did not come through.</b> The formulas here are the standard textbook forms, written with your notes' variable names (PV, FV, A, i, n, m). Check them against your slides.</li>
  <li><b>Exam coverage confirmed: Chapters 6, 8, 9, 16, 17 and 18.</b> All six are in the notes, and every topic in this guide comes from them. Chapter 7 is not on the exam.</li>
  <li>Possible errors in the notes are flagged inside each lesson (REIT 90% vs 95%, cost approach $717,500 vs $718,000, the “FVA” label on the loan balance formula).</li></ul></section>`;
}

/* ---------- topics ---------- */
let openTopic=null;
function renderTopics(){
  const el=document.getElementById('p-topics');
  el.innerHTML=`<p class="intro">A topic turns <b>Exam-ready</b> only after you get at least 4 of your last 5 questions on it right. Opening a lesson moves it to Learning.</p>`+
  TOPICS.map(t=>{const st=status(t.id),s=stats(t.id),open=openTopic===t.id;
   return `<article class="topic ${open?'open':''}" id="topic-${t.id}"><button class="topic-row" data-topic="${t.id}" aria-expanded="${open}">
   <span class="topic-unit">${t.unit}</span><span class="topic-name">${t.name}</span>${chip(st)}
   <span class="pips" aria-label="last five answers">${[0,1,2,3,4].map(i=>{const v=s.last[i];return `<i class="pip ${v===1?'ok':v===0?'no':''}"></i>`;}).join('')}</span></button>
   ${open?`<div class="lesson"><p class="hint">${statusHint(t.id)}</p>${LESSONS[t.id]}<div class="lesson-actions"><button class="btn" data-practice="${t.id}">Practice this topic</button></div></div>`:''}</article>`;}).join('');
}

/* ---------- practice ---------- */
let P=null; // {title, qs, i, picked, done, score}
function startPractice(kind){
  let qs=[],title='';
  if(kind==='diag'){title='Diagnostic';qs=['lump','annuity','npv','pay','bal','points','uw','apm','k','brk'].map(id=>makeQ(id));}
  else if(kind==='theory'){title='Theory mix';qs=buildSet(15,THEORY_SLOTS);}
  else if(kind==='weak'){title='Weakest topics';const order=TOPICS.map(t=>({id:t.id,w:{ns:4,le:3,np:2,er:0.5}[status(t.id)]}));
    for(let i=0;i<10;i++){const tot=order.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot;const t=order.find(o=>(r-=o.w)<0)||order[0];qs.push(makeQ(t.id));}}
  else {title=TOPIC[kind].name;qs=dedupe(Array.from({length:8}),()=>makeQ(kind));}
  P={title,qs,i:0,picked:null,done:false,score:0,kind};
  go('practice');
}
function qHTML(q,n,name,picked,reveal){
  return `<div class="q"><div class="q-meta">${n?`<span>${n}</span>`:''}<span>${TOPIC[q.topic].unit} · ${TOPIC[q.topic].name}</span></div>
  <div class="q-prompt">${q.prompt}</div><div class="opts" role="radiogroup">${q.choices.map((c,j)=>{
    let cls='';if(reveal){if(j===q.answer)cls='right';else if(j===picked)cls='wrong';}
    return `<label class="opt ${cls} ${picked===j?'sel':''}"><input type="radio" name="${name}" value="${j}" ${picked===j?'checked':''} ${reveal?'disabled':''}><span class="opt-l">${'ABCD'[j]}</span><span>${c}</span></label>`;}).join('')}</div>
  ${reveal?`<div class="sol ${picked===q.answer?'sol-ok':'sol-no'}"><div class="sol-h">${picked===q.answer?'Correct':'Not quite. The answer is '+'ABCD'[q.answer]}</div>${q.sol}</div>`:''}</div>`;
}
function renderPractice(){
  const el=document.getElementById('p-practice');
  if(!P){
    el.innerHTML=`<div class="starts"><button class="start" data-start="diag"><b>Diagnostic</b><span>10 questions, one per major topic. Start here.</span></button>
    <button class="start" data-start="theory"><b>Theory mix</b><span>15 concept and key-term questions from all six chapters. No math.</span></button>
    <button class="start" data-start="weak"><b>Weakest topics</b><span>10 questions weighted toward topics that aren't exam-ready.</span></button></div>
    <h3 class="h-sub">Or pick one topic (8 questions)</h3><div class="topic-grid">${TOPICS.map(t=>`<button class="tpick" data-start="${t.id}"><span>${t.name}</span>${chip(status(t.id))}</button>`).join('')}</div>`;
    return;}
  if(P.done){
    el.innerHTML=`<div class="result"><h3>${P.title}: ${P.score} / ${P.qs.length}</h3><p>${P.score/P.qs.length>=0.8?'Strong set.':'Every miss is saved in the Mistakes tab with the full solution.'}</p>
    <div class="btns"><button class="btn" data-start="${P.kind}">Another set</button><button class="btn ghost" data-go="topics">See topic status</button><button class="btn ghost" data-reset-practice>Choose a different set</button></div></div>`;return;}
  const q=P.qs[P.i],rev=P.checked;
  el.innerHTML=`<div class="practice-bar"><b>${P.title}</b><span>Question ${P.i+1} of ${P.qs.length} · ${P.score} correct</span><button class="link" data-reset-practice>Quit</button></div>
  ${qHTML(q,'',`pq`,P.picked,rev)}
  <div class="btns">${rev?`<button class="btn" data-next>${P.i+1<P.qs.length?'Next question':'See results'}</button>`:`<button class="btn" data-check ${P.picked==null?'disabled':''}>Check answer</button>`}</div>`;
}

/* ---------- exam ---------- */
let E=null; // {qs, picks, end, submitted}
/* exam blueprint: about two-thirds theory, one-third math, matching how the notes are weighted */
const THEORY_SLOTS=[['kt6',4],['kt8',4],['kt9',4],['kt16',6],['kt17',3],['kt18',2],['k',5],['brk',5],['apc',5],['fin',6],['npv',1],['pay',1],['points',1],['arm',1],['uw',1]].map(([id,w])=>({id,w,mode:'theory'}));
const MATH_SLOTS=[['lump',2],['annuity',2],['npv',2],['pay',3],['bal',3],['refi',2],['points',2],['arm',2],['uw',3],['apm',3]].map(([id,w])=>({id,w,mode:'math'}));
function dedupe(arr,fn){const seen=new Set();return arr.map(()=>{let q,t=0;do{q=fn();}while(seen.has(q.key||q.prompt)&&++t<40);seen.add(q.key||q.prompt);return q;});}
function buildSet(n,slots){
  const tot=slots.reduce((a,b)=>a+b.w,0);
  const alloc=slots.map(x=>({...x,c:Math.floor(n*x.w/tot),r:n*x.w/tot%1}));
  const left=n-alloc.reduce((a,b)=>a+b.c,0);
  alloc.slice().sort((a,b)=>b.r-a.r).slice(0,left).forEach(a=>a.c++);
  const seen=new Set(),qs=[];
  alloc.forEach(a=>{for(let k=0;k<a.c;k++){let q,t=0;do{q=makeQ(a.id,a.mode);}while(seen.has(q.key||q.prompt)&&++t<40);seen.add(q.key||q.prompt);qs.push(q);}});
  return shuffle(qs);
}
function startExam(n,mins,kind){
  E={qs:buildSet(n,kind==='theory'?THEORY_SLOTS:THEORY_SLOTS.concat(MATH_SLOTS)),picks:{},end:Date.now()+mins*60000,mins,submitted:false};
  go('exam');
}
let examTimer=null;
function renderExam(){
  const el=document.getElementById('p-exam');
  clearInterval(examTimer);
  if(!E){
    const past=S.exams.slice(0,5);
    el.innerHTML=`<div class="intro"><p>Simulates the real thing: multiple choice, no formulas, TI-84 only, no feedback until you submit. Mixed exams are about two-thirds theory (concepts and key terms from all six chapters) and one-third math, with no repeated questions or terms. Have paper and your calculator ready.</p></div>
    <div class="starts"><button class="start" data-exam="60,120"><b>Full practice exam</b><span>60 questions · 120 minutes</span></button><button class="start" data-exam="75,150"><b>Extended practice exam</b><span>75 questions · 150 minutes</span></button><button class="start" data-exam="60,75,theory"><b>Theory exam</b><span>60 concept and key-term questions · 75 minutes · no math</span></button></div>
    ${past.length?`<h3 class="h-sub">Past attempts</h3><table class="tbl"><tr><th>When</th><th>Score</th><th>Time used</th></tr>${past.map(x=>`<tr><td>${new Date(x.t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}</td><td>${x.score}/${x.n} (${Math.round(x.score/x.n*100)}%)</td><td>${x.used} min</td></tr>`).join('')}</table>`:''}`;
    return;}
  const answered=Object.keys(E.picks).length;
  if(!E.submitted){
    el.innerHTML=`<div class="exam-bar"><span id="clock" class="clock"></span><span>${answered}/${E.qs.length} answered</span><button class="btn" data-submit>Submit exam</button></div>`+
    E.qs.map((q,i)=>qHTML(q,`Q${i+1}`,`ex${i}`,E.picks[i]??null,false)).join('')+`<div class="btns"><button class="btn" data-submit>Submit exam</button></div>`;
    const tick=()=>{const ms=E.end-Date.now();const c=document.getElementById('clock');if(!c)return;
      if(ms<=0){submitExam();return;}
      const m=Math.floor(ms/6e4),s=Math.floor(ms%6e4/1000);c.textContent=`${m}:${String(s).padStart(2,'0')} left`;c.classList.toggle('low',ms<5*6e4);};
    tick();examTimer=setInterval(tick,1000);return;}
  const by={};E.qs.forEach((q,i)=>{const b=by[q.topic]=by[q.topic]||{n:0,c:0};b.n++;if(E.picks[i]===q.answer)b.c++;});
  el.innerHTML=`<div class="result"><h3>Score: ${E.score} / ${E.qs.length} (${Math.round(E.score/E.qs.length*100)}%)</h3><p>Time used: ${E.used} of ${E.mins} minutes. Misses are saved in the Mistakes tab.</p>
  <table class="tbl"><tr><th>Topic</th><th>Correct</th><th>Status now</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${TOPIC[k].name}</td><td>${v.c}/${v.n}</td><td>${chip(status(k))}</td></tr>`).join('')}</table>
  <div class="btns"><button class="btn" data-go="mistakes">Review mistakes</button><button class="btn ghost" data-exam-new>Back to exam menu</button></div></div>`+
  E.qs.map((q,i)=>qHTML(q,`Q${i+1}`,`ex${i}`,E.picks[i]??null,true)).join('');
}
function submitExam(){
  if(!E||E.submitted)return;clearInterval(examTimer);
  E.submitted=true;E.used=Math.min(E.mins,Math.ceil((Date.now()-(E.end-E.mins*60000))/6e4));
  E.score=E.qs.reduce((s,q,i)=>s+(record(q,E.picks[i]??null)?1:0),0);
  S.exams.unshift({t:Date.now(),score:E.score,n:E.qs.length,used:E.used});S.exams=S.exams.slice(0,10);
  save();renderHeader();renderExam();window.scrollTo(0,0);
}

/* ---------- mistakes ---------- */
function renderMistakes(){
  const el=document.getElementById('p-mistakes');
  if(!S.mistakes.length){el.innerHTML=`<div class="empty"><h3>No mistakes saved yet</h3><p>Every question you miss in practice or on a practice exam lands here with its full solution, so you can learn from it and retry a fresh version.</p><button class="btn" data-go="practice">Start practicing</button></div>`;return;}
  el.innerHTML=`<p class="intro">${S.mistakes.length} saved. Read the solution, then try a fresh question on the same topic until you get it right.</p>`+
  S.mistakes.map((m,i)=>`<article class="mistake"><div class="q-meta"><span>${TOPIC[m.topic].unit} · ${TOPIC[m.topic].name}</span>${chip(status(m.topic))}</div><div class="q-prompt">${m.prompt}</div>
  <p class="mis-ans"><span class="bad">You chose: ${m.given}</span><span class="good">Answer: ${m.right}</span></p>
  <details><summary>Show solution</summary><div class="sol">${m.sol}</div></details>
  <div class="btns"><button class="btn" data-start="${m.topic}">Try a similar question</button><button class="link" data-dismiss="${i}">Got it, remove</button></div></article>`).join('');
}

/* ---------- formulas ---------- */
let flipped={},showAll=false,fcMode='terms',fcCh=6;
function renderFormulas(){
  const el=document.getElementById('p-formulas');
  const cards=fcMode==='formulas'?FORMULAS.map(f=>({name:f[0],when:f[1],back:f[2],mono:true})):TERMS.filter(t=>t.c===fcCh).map(t=>({name:t.t,when:'Chapter '+t.c,back:esc(t.d)}));
  el.innerHTML=`<div class="intro"><p>No formula sheet on the exam, so all of this has to come from memory. Say the definition or formula out loud, then tap the card to check.</p>
  <div class="seg-ctl" role="group" aria-label="Card set"><button class="${fcMode==='terms'?'on':''}" data-fcmode="terms">Key terms</button><button class="${fcMode==='formulas'?'on':''}" data-fcmode="formulas">Formulas</button></div>
  ${fcMode==='terms'?`<div class="seg-ctl" role="group" aria-label="Chapter">${[6,8,9,16,17,18].map(c=>`<button class="${fcCh===c?'on':''}" data-fcch="${c}">Ch ${c}</button>`).join('')}</div>`:''}
  <div class="btns"><button class="btn ghost" data-shuffle>Shuffle</button><button class="btn ghost" data-showall>${showAll?'Hide all answers':'Show all answers'}</button><span class="muted">${cards.length} cards</span></div></div>
  <div class="cards">${(fcOrder&&fcOrder.length===cards.length?fcOrder.map(i=>cards[i]):cards).map((c,j)=>{const i=fcOrder&&fcOrder.length===cards.length?fcOrder[j]:j;const open=showAll||flipped[i];return `<button class="card ${open?'flip':''} ${c.mono?'':'card-term'}" data-card="${i}"><span class="card-name">${esc(c.name)}</span><span class="card-when">${c.when}</span><span class="card-eq">${open?c.back:'Tap to reveal'}</span></button>`;}).join('')}</div>`;
}
let fcOrder=null;

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){location.hash=d.tab;go(d.tab);}
  else if(d.go){if(TOPIC[d.go]){openTopic=d.go;if(!S.read[d.go]){S.read[d.go]=1;save();renderHeader();}go('topics');setTimeout(()=>{const t=document.getElementById('topic-'+d.go);t&&t.scrollIntoView({block:'start'});},0);}
    else if(d.go==='diag'||d.go==='weak'||d.go==='theory')startPractice(d.go);else if(d.go==='exam'){E=null;go('exam');}else go(d.go);}
  else if(d.topic){openTopic=openTopic===d.topic?null:d.topic;if(openTopic&&!S.read[openTopic]){S.read[openTopic]=1;save();renderHeader();}renderTopics();if(openTopic){const t=document.getElementById('topic-'+openTopic);t&&t.scrollIntoView({block:'start'});}}
  else if(d.practice||d.start)startPractice(d.practice||d.start);
  else if('check' in d){const q=P.qs[P.i];P.checked=true;if(record(q,P.picked))P.score++;save();renderHeader();renderPractice();}
  else if('next' in d){P.i++;P.picked=null;P.checked=false;if(P.i>=P.qs.length)P.done=true;renderPractice();window.scrollTo(0,0);}
  else if('resetPractice' in d){P=null;renderPractice();}
  else if(d.exam){const [n,m,k]=d.exam.split(',');startExam(+n,+m,k);}
  else if('submit' in d)submitExam();
  else if('examNew' in d){E=null;renderExam();}
  else if(d.dismiss!=null&&d.dismiss!==''){S.mistakes.splice(+d.dismiss,1);save();renderMistakes();}
  else if(d.card!=null){flipped[d.card]=!flipped[d.card];renderFormulas();}
  else if('shuffle' in d){const n=fcMode==='formulas'?FORMULAS.length:TERMS.filter(t=>t.c===fcCh).length;fcOrder=shuffle([...Array(n).keys()]);flipped={};renderFormulas();}
  else if(d.fcmode){fcMode=d.fcmode;fcOrder=null;flipped={};renderFormulas();}
  else if(d.fcch){fcCh=+d.fcch;fcOrder=null;flipped={};renderFormulas();}
  else if('showall' in d){showAll=!showAll;renderFormulas();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.plan){S.plan[t.dataset.plan]=t.checked;save();renderPlan();}
  else if(t.name==='pq'&&P&&!P.checked){P.picked=+t.value;renderPractice();}
  else if(t.name&&t.name.startsWith('ex')&&E&&!E.submitted){E.picks[+t.name.slice(2)]=+t.value;const bar=document.querySelector('.exam-bar span:nth-child(2)');if(bar)bar.textContent=`${Object.keys(E.picks).length}/${E.qs.length} answered`;
    t.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));}
});
renderAll();go(['plan','topics','practice','exam','mistakes','formulas'].includes(tab)?tab:'plan');
</script>
