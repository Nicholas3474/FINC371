<title>FINC 371 Exam 2 Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single study column under a sticky tab bar; the header is a closing statement with a readiness meter. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --ink:#17201D; --muted:#5A6762; --line:#D6DDD9;
  --accent:#2C4A9A; --accent-soft:#E3E9F7; --on-accent:#FFFFFF;
  --ns:#8B9590; --le:#3A73CF; --np:#B7790A; --er:#1F7F55; --bad:#B9382B; --bad-soft:#F8E6E3; --ok-soft:#E1F1E8;
  --keys:#F4F1E6; --keys-line:#DCD4B8;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#172020; --sunk:#1E2928; --ink:#E3EAE7; --muted:#97A49F; --line:#2B3735;
  --accent:#93AAF2; --accent-soft:#222E4D; --on-accent:#0F1513;
  --ns:#7D8884; --le:#78A6F0; --np:#E2A93A; --er:#4CC08A; --bad:#F08A7C; --bad-soft:#3A2220; --ok-soft:#183427;
  --keys:#242318; --keys-line:#4A4630; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#172020; --sunk:#1E2928; --ink:#E3EAE7; --muted:#97A49F; --line:#2B3735;
  --accent:#93AAF2; --accent-soft:#222E4D; --on-accent:#0F1513;
  --ns:#7D8884; --le:#78A6F0; --np:#E2A93A; --er:#4CC08A; --bad:#F08A7C; --bad-soft:#3A2220; --ok-soft:#183427;
  --keys:#242318; --keys-line:#4A4630; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);font-stretch:85%;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--keys-line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+label,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{padding-block:28px 18px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:clamp(30px,6vw,44px);font-weight:800;line-height:1.02;margin-top:8px}
.top-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:8px}
#countdown{font:600 15px var(--mono);color:var(--accent)}
#sync{font-size:13px;color:var(--muted)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:16px;gap:2px}
.seg{display:block;height:100%}.seg-ns{background:var(--ns)}.seg-le{background:var(--le)}.seg-np{background:var(--np)}.seg-er{background:var(--er)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot-ns{background:var(--ns)}.dot-le{background:var(--le)}.dot-np{background:var(--np)}.dot-er{background:var(--er)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 12px;font:600 15px var(--body);color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 64px}
.panel{display:flex;flex-direction:column;gap:16px}.panel[hidden]{display:none}
.intro{color:var(--muted);margin:0}.intro p{margin:0 0 10px}
.h-sub{font-size:20px;margin-top:8px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-ns{color:var(--ns)}.chip-le{color:var(--le)}.chip-np{color:var(--np)}.chip-er{color:var(--er);background:var(--ok-soft)}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}

/* plan */
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.day header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.day h3{font-size:22px}
.day-count{margin-left:auto;font:600 13px var(--mono);color:var(--muted)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.checks input{width:18px;height:18px;accent-color:var(--er);flex:none}
.checks label{flex:1 1 220px;min-width:0}
.checks input:checked+label{color:var(--muted);text-decoration:line-through}
.notes{border-left:3px solid var(--np);padding:4px 0 4px 16px}
.notes h3{font-size:18px}.notes ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:15px}

/* topics */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:64px}
.topic-row{width:100%;display:grid;grid-template-columns:62px 1fr auto auto;gap:10px;align-items:center;padding:14px 16px;background:none;border:0;text-align:left}
.topic-unit{font:600 12px var(--mono);color:var(--muted)}
.topic-name{font-weight:700;min-width:0}
.pips{display:flex;gap:3px}.pip{width:8px;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}.pip.ok{background:var(--er);border-color:var(--er)}.pip.no{background:var(--bad);border-color:var(--bad)}
@media (max-width:560px){.topic-row{grid-template-columns:1fr auto}.topic-unit{grid-column:1/-1}.pips{grid-column:1/-1}}
.lesson{padding:4px 18px 20px;border-top:1px solid var(--line);max-width:100%}
.lesson p,.lesson li{max-width:70ch}
.lesson h4{font-size:18px;margin:18px 0 6px}
.lesson ul,.lesson ol{padding-left:20px}
.hint{font:600 13px var(--mono);color:var(--muted)}
.rule{font-family:var(--display);font-size:20px;font-weight:700;border-left:4px solid var(--accent);padding-left:12px}
.lesson-actions{margin-top:16px}
.fcard{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
.fcard-h{font:700 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);padding:8px 12px}
.eq{font-family:var(--mono);font-size:15px;overflow-x:auto}
.eq.big{font-size:17px;padding:12px;background:var(--accent-soft)}
.fcard dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0;padding:12px;font-size:15px}
.fcard dt{font-weight:700;color:var(--muted)}.fcard dd{margin:0;min-width:0}
@media (max-width:560px){.fcard dl{grid-template-columns:1fr}.fcard dd{margin-bottom:6px}}
.example{background:var(--sunk);border-radius:10px;padding:12px 14px;margin:14px 0}
.example-h{font:700 13px var(--mono);color:var(--accent);margin-bottom:4px}
.example p{margin:4px 0}
.flag{border-left:3px solid var(--np);background:var(--surface);padding:8px 12px;margin:12px 0;font-size:15px}
.flag::before{content:"Check this · ";font-weight:700;color:var(--np)}
.keys{background:var(--keys);border:1px solid var(--keys-line);border-radius:8px;padding:10px 12px;margin:10px 0;font:14px/1.6 var(--mono);overflow-x:auto}
.keys-h{display:inline-block;font-weight:700;margin-right:8px;color:var(--np)}
.tbl{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;display:block;overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
.tbl th{font:700 12px var(--mono);text-transform:uppercase;color:var(--muted)}

/* practice */
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.start{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.start b{font-family:var(--display);font-size:20px}.start span{color:var(--muted);font-size:15px}
.start:hover,.tpick:hover{border-color:var(--accent)}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.tpick{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.practice-bar,.exam-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:15px}
.exam-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:4;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.practice-bar span{color:var(--muted)}
.clock{font:700 18px var(--mono)}.clock.low{color:var(--bad)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.q-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.q-prompt{font-size:18px;margin:10px 0 14px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);background:var(--sunk)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}.opt.sel .opt-l{background:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--er);background:var(--ok-soft)}.opt.right .opt-l{background:var(--er);color:var(--on-accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .opt-l{background:var(--bad);color:var(--on-accent)}
.sol{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:16px}
.sol p{margin:6px 0}.sol .eq{line-height:1.8}
.sol-h{font:700 16px var(--display);font-stretch:85%}
.sol-ok .sol-h{color:var(--er)}.sol-no .sol-h{color:var(--bad)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.result h3{font-size:26px}

/* mistakes */
.mistake{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:12px;padding:16px 18px}
.mis-ans{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600}.bad{color:var(--bad)}.good{color:var(--er)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:6px}
.empty{text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px}

/* key facts */
.facts{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.facts h3{font-size:22px;display:flex;gap:10px;align-items:baseline}.facts h3 span{font:600 13px var(--mono);color:var(--muted)}
.facts dl{display:grid;grid-template-columns:minmax(130px,190px) 1fr;gap:0;margin:10px 0 0}
.facts dt,.facts dd{padding:8px 0;border-top:1px solid var(--line);margin:0}
.facts dt{font-weight:700;padding-right:12px}.facts dd{min-width:0}
@media (max-width:560px){.facts dl{grid-template-columns:1fr}.facts dd{border-top:0;padding-top:0}}
/* games */
.g-grid{margin-top:10px}.g-lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.g-tag{font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
.g-terms{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.g-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;text-align:left}
.g-defs{display:flex;flex-direction:column;gap:8px}
.g-def{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px}
.g-sel{border-color:var(--accent);background:var(--accent-soft)}
.g-ok{border-color:var(--er);background:var(--ok-soft);color:var(--ink)}
.g-bad{border-color:var(--bad);background:var(--bad-soft)}
.g-miss{border-style:dashed;border-color:var(--er);color:var(--er)}
.g-chip[disabled],.g-def[disabled]{cursor:default}
.g-order{margin:8px 0;padding-left:22px}.g-order li{padding:3px 0;font-weight:600}
/* flashcards */
.seg-ctl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.seg-ctl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.seg-ctl button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card-term .card-eq{font-family:var(--body);font-size:15px}
.gloss{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 16px;margin:12px 0}
.gloss dt{font-weight:700}.gloss dd{margin:0;min-width:0;color:var(--ink)}
@media (max-width:560px){.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:8px}}
.def{display:block;margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.card-name{font:700 18px var(--display);font-stretch:85%}
.card-when{font-size:14px;color:var(--muted)}
.card-eq{margin-top:auto;font:14px/1.5 var(--mono);color:var(--muted)}
.card.flip{border-color:var(--accent)}.card.flip .card-eq{color:var(--ink);background:var(--accent-soft);padding:8px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.opt,.card,.start,.tpick{transition:border-color .15s,background-color .15s}}
</style>

<header class="top"><div class="wrap">
  <div class="eyebrow">FINC 371 · Real estate · Exam 2 · Thu Oct 22, 1:00 PM</div>
  <h1>Exam 2 study guide</h1>
  <div class="top-row"><span id="countdown"></span><span id="sync">Loading progress…</span></div>
  <div class="meter" id="meter" aria-label="Topic readiness"></div>
  <div class="legend" id="meter-legend"></div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist">
  <button class="tab" role="tab" data-tab="plan">Plan</button>
  <button class="tab" role="tab" data-tab="topics">Topics &amp; lessons</button>
  <button class="tab" role="tab" data-tab="facts">Key facts</button>
  <button class="tab" role="tab" data-tab="practice">Practice</button>
  <button class="tab" role="tab" data-tab="games">Games</button>
  <button class="tab" role="tab" data-tab="exam">Practice exam</button>
  <button class="tab" role="tab" data-tab="mistakes">Mistakes</button>
  <button class="tab" role="tab" data-tab="formulas">Flashcards</button>
</div></nav>
<main class="wrap">
  <section class="panel" id="p-plan"></section>
  <section class="panel" id="p-topics" hidden></section>
  <section class="panel" id="p-facts" hidden></section>
  <section class="panel" id="p-practice" hidden></section>
  <section class="panel" id="p-games" hidden></section>
  <section class="panel" id="p-exam" hidden></section>
  <section class="panel" id="p-mistakes" hidden></section>
  <section class="panel" id="p-formulas" hidden></section>
</main>
